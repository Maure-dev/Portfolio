<!doctype html>

<head>
  <meta charset="UTF-8" />
  <script>
    // Apply the persisted theme before first paint to avoid a flash of the
    // wrong theme. Dark is the default: only an explicit 'light' choice opts out.
    (function () {
      try {
        var isLight = localStorage.getItem("theme") === "light";
        document.documentElement.classList.add(isLight ? "light" : "dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
